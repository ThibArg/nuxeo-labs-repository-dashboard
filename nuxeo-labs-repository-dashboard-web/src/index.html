<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Repository Dashboard</title>
    <!--
      The base tag below is rewritten into a JSP expression at package time by
      nuxeo_build_tools/htmlToJsp.mjs, so that the deployment path stays configurable through the
      app.base.url Nuxeo property. Keep it as a plain root href so that `ng serve` works untouched.
    -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <nxd-root></nxd-root>
  </body>
</html>
